name: Build Parent Hub firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Arduino sketch
        run: |
          rm -rf firmware/ParentHub
          mkdir -p firmware/ParentHub
          unzip -j source/ParentHub_Pro_V4.zip ParentHub.ino web_ui.h -d firmware/ParentHub
          test -f firmware/ParentHub/ParentHub.ino
          test -f firmware/ParentHub/web_ui.h

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install ArduinoJson

      - name: Compile
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build firmware/ParentHub
          cp build/ParentHub.ino.bin build/ParentHub.bin

      - uses: actions/upload-artifact@v4
        with:
          name: ParentHub-firmware
          path: build/ParentHub.bin

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ParentHub.bin
          generate_release_notes: true
